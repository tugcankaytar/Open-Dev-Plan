[project]
name = "open-dev-plan"
version = "0.1.0"
description = "Local-LLM powered work planning app: meeting transcription, task/action extraction, Kanban/Gantt, and calendar scheduling — all on-device."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Tuğcan Kaytar" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "ollama>=0.6.2",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "icalendar>=6.1",
    "sqlite-vec>=0.1.6",
    "markdown>=3.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "unsloth>=2024.12",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
]
pdf = [
    "weasyprint>=63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
odp = "odp.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-3 flag ambiguous-looking Unicode (e.g. Turkish dotless ı vs. Latin i)
# in string literals. This codebase is intentionally full of Turkish text
# (prompts, UI strings, test fixtures), so that check is pure noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "gpu: requires a local GPU + running Ollama/Whisper models",
    "eval: runs the LLM quality eval harness (slow, needs models)",
]
testpaths = ["tests"]
